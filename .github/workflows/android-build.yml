name: Build MBG Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

# Proyek Gradle ada di subfolder ini, bukan di root repo.
defaults:
  run:
    working-directory: MBG-Android-Studio

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # JANGAN pakai android-actions/setup-android@v3: action itu gagal di
      # image runner terbaru (sdkmanager internalnya mencari paket lama
      # 'tools' yang sudah dihapus Google -> exit 1 sebelum build mulai).
      # Runner ubuntu-latest SUDAH membawa Android SDK terpasang di
      # $ANDROID_SDK_ROOT, jadi cukup lengkapi paket yang dibutuhkan.
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      # Repo ini tidak punya Gradle Wrapper (gradlew), jadi Gradle
      # disediakan lewat action ini. 8.9 = versi yang ditargetkan AGP 8.7.3.
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK debug
        run: gradle --no-daemon assembleDebug

      # Path artifact dihitung dari root workspace, BUKAN dari
      # working-directory di atas.
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MBG-debug-APK
          path: MBG-Android-Studio/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      # Setiap push TAG versi (v*), APK yang sama juga diterbitkan sebagai
      # aset GitHub Release bernama tetap MBG.apk. Inilah yang diunduh fitur
      # update-dari-dalam-aplikasi lewat URL stabil
      # releases/latest/download/MBG.apk. Artifact Actions tetap seperti biasa.
      - name: Publish APK to GitHub Release (tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk MBG.apk
          gh release create "${{ github.ref_name }}" MBG.apk --title "MBG ${{ github.ref_name }}" --notes "APK debug MBG ${{ github.ref_name }}. Instal pertama: unduh MBG.apk dari halaman rilis ini, lalu pasang manual. Update berikutnya dapat dilakukan dari dalam aplikasi (Pengaturan, bagian Versi & Update)." || gh release upload "${{ github.ref_name }}" MBG.apk --clobber
